server {
    listen 80;
    server_name form-easy.llamazing.cn;
    return 301 $scheme://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name form-easy.llamazing.cn;

    ssl_certificate /etc/nginx/ssl/form-easy.llamazing.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/form-easy.llamazing.cn.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-DSS-AES128-GCM-SHA256:kEDH+AESGCM;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://172.17.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}